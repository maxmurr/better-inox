allowBuilds:
  '@sentry/cli': true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@16.3.0'
  - '@next/swc-darwin-arm64@16.3.0'
  - '@next/swc-darwin-x64@16.3.0'
  - '@next/swc-linux-arm64-gnu@16.3.0'
  - '@next/swc-linux-arm64-musl@16.3.0'
  - '@next/swc-linux-x64-gnu@16.3.0'
  - '@next/swc-linux-x64-musl@16.3.0'
  - '@next/swc-win32-arm64-msvc@16.3.0'
  - '@next/swc-win32-x64-msvc@16.3.0'
  - next@16.3.0
  - '@next/mdx@16.3.0'
  - '@next/eslint-plugin-next@16.3.0'
  - eslint-config-next@16.3.0

# Exact pins to the minimal patched release for security advisories,
# kept on the same major line as the parent packages' requirements.
overrides:
  '@hono/node-server@<2.1.3': '2.1.3'
  '@modelcontextprotocol/sdk@<1.32.0': '1.32.0'
  'body-parser@<2.4.0': '2.4.0'
  'brace-expansion@<1.1.21': '1.1.21'
  'brace-expansion@>=5.0.0 <5.0.12': '5.0.12'
  'fast-uri@<3.1.9': '3.1.9'
  'handlebars@<4.7.10': '4.7.10'
  'hono@<4.13.11': '4.13.11'
  'ip-address@<=10.7.3': '10.7.4'
  'js-yaml@<4.3.2': '4.3.2'
  'nanoid@<3.3.18': '3.3.20'
  'postcss-selector-parser@<7.1.6': '7.1.6'
  'proxy-addr@<2.0.8': '2.0.8'
  'qs@<6.16.1': '6.16.1'
  'source-map-js@<1.2.2': '1.2.2'
  'systeminformation@<5.33.16': '5.33.16'
  'undici@<7.30.1': '7.30.1'
  'vite@<8.2.4': '8.2.4'
